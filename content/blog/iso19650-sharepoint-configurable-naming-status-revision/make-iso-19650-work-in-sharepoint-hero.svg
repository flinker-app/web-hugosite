<svg xmlns="http://www.w3.org/2000/svg"
     width="923"
     height="615"
     viewBox="0 0 923 615"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Make ISO 19650 work in SharePoint.</title>
  <desc id="desc">A clean hero illustration showing Naming, Status and Revision flowing into SharePoint.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".68" stop-color="#FBFCFF"/>
      <stop offset="1" stop-color="#F2F6FC"/>
    </linearGradient>

    <linearGradient id="headlineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2580F4"/>
      <stop offset="1" stop-color="#076EFF"/>
    </linearGradient>

    <linearGradient id="iconBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1787FF"/>
      <stop offset="1" stop-color="#076EFF"/>
    </linearGradient>

    <linearGradient id="iconTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B9B4"/>
      <stop offset="1" stop-color="#07959E"/>
    </linearGradient>

    <linearGradient id="iconViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667FF0"/>
      <stop offset="1" stop-color="#435CE0"/>
    </linearGradient>

    <linearGradient id="spTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08A2A8"/>
      <stop offset="1" stop-color="#05747E"/>
    </linearGradient>

    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE9FA" stop-opacity=".10"/>
      <stop offset=".30" stop-color="#A8C9F6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1678F1"/>
    </linearGradient>

    <linearGradient id="lineTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDF3F3" stop-opacity=".10"/>
      <stop offset=".30" stop-color="#9FDEDE" stop-opacity=".44"/>
      <stop offset="1" stop-color="#0AA4AA"/>
    </linearGradient>

    <linearGradient id="lineViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4E8FB" stop-opacity=".10"/>
      <stop offset=".30" stop-color="#BCC5F6" stop-opacity=".44"/>
      <stop offset="1" stop-color="#586FE5"/>
    </linearGradient>

    <filter id="cardShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="19"
                    flood-color="#173B66" flood-opacity=".13"/>
    </filter>

    <filter id="logoShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
                    flood-color="#075B66" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="923" height="615" rx="28" fill="url(#bg)"/>

  <!-- Focus rings -->
  <circle cx="752" cy="306" r="190" fill="#EAF2FD"/>
  <circle cx="752" cy="306" r="151" fill="#DDEBFC"/>
  <circle cx="752" cy="306" r="112" fill="#CEE2FC"/>

  <!-- Headline -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="47"
          y="210"
          font-size="55"
          font-weight="700"
          letter-spacing="-1.5"
          fill="#06194A">Make ISO 19650</text>

    <text x="47"
          y="277"
          font-size="55"
          font-weight="700"
          letter-spacing="-1.5"
          fill="#06194A">work in</text>

    <text x="47"
          y="347"
          font-size="61"
          font-weight="700"
          letter-spacing="-1.9"
          fill="url(#headlineBlue)">SharePoint.</text>
  </g>

  <!-- Straight aligned connector lines -->
  <g fill="none"
     stroke-width="4"
     stroke-linecap="round">
    <path d="M358 240H531" stroke="url(#lineBlue)"/>
    <path d="M358 322H531" stroke="url(#lineTeal)"/>
    <path d="M358 404H531" stroke="url(#lineViolet)"/>
  </g>

  <!-- Information card -->
  <g transform="rotate(6 638 336)"
     filter="url(#cardShadow)">

    <rect x="514"
          y="176"
          width="256"
          height="334"
          rx="25"
          fill="#FFFFFF"/>

    <!-- Fold -->
    <path d="M709 176
             H742
             C758 176 770 188 770 204
             V241
             C757 222 739 212 709 208Z"
          fill="#EFF4FA"/>

    <path d="M709 208
             C731 210 749 220 770 241
             C748 235 728 231 711 231Z"
          fill="#E3EBF7"/>

    <!-- Naming -->
    <rect x="543"
          y="222"
          width="55"
          height="55"
          rx="11"
          fill="url(#iconBlue)"/>

    <text x="570.5"
          y="258"
          text-anchor="middle"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="23"
          fill="#FFFFFF">Aa</text>

    <text x="618"
          y="246"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="17"
          font-weight="600"
          fill="#071747">Naming</text>

    <rect x="618" y="260" width="109" height="6" rx="3" fill="#D9E2EF"/>
    <rect x="618" y="274" width="82" height="6" rx="3" fill="#E5EBF3"/>

    <!-- Status -->
    <rect x="543"
          y="319"
          width="55"
          height="55"
          rx="11"
          fill="url(#iconTeal)"/>

    <path d="M556 346l9 9 19-20"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <text x="618"
          y="343"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="17"
          font-weight="600"
          fill="#071747">Status</text>

    <rect x="618" y="357" width="93" height="6" rx="3" fill="#D9E2EF"/>
    <rect x="618" y="371" width="67" height="6" rx="3" fill="#E5EBF3"/>

    <!-- Revision -->
    <rect x="543"
          y="416"
          width="55"
          height="55"
          rx="11"
          fill="url(#iconViolet)"/>

    <path d="M558 443
             A13 13 0 1 0 561 434"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"/>

    <path d="M556 431v9h9"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M571 438v8l6 3"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <text x="618"
          y="440"
          font-family="Segoe UI, Arial, sans-serif"
          font-size="17"
          font-weight="600"
          fill="#071747">Revision</text>

    <rect x="618" y="454" width="99" height="6" rx="3" fill="#D9E2EF"/>
    <rect x="618" y="468" width="72" height="6" rx="3" fill="#E5EBF3"/>
  </g>

  <!-- SharePoint mark -->
  <g transform="translate(719 299)"
     filter="url(#logoShadow)">

    <circle cx="91" cy="61" r="50" fill="#087C87"/>
    <circle cx="132" cy="104" r="47" fill="#0EADB2"/>
    <circle cx="91" cy="142" r="38" fill="#22C5C5"/>
    <circle cx="79" cy="98" r="53" fill="#078E98"/>

    <g transform="rotate(6 52 99)">
      <rect x="5"
            y="51"
            width="101"
            height="101"
            rx="17"
            fill="#075E69"
            opacity=".18"/>

      <rect x="0"
            y="45"
            width="101"
            height="101"
            rx="17"
            fill="url(#spTile)"/>

      <text x="50.5"
            y="115"
            text-anchor="middle"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="60"
            font-weight="700"
            fill="#FFFFFF">S</text>
    </g>
  </g>

</svg>