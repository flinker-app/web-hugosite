<svg xmlns="http://www.w3.org/2000/svg" width="923" height="615" viewBox="0 0 923 615">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#24466F" flood-opacity=".11"/>
    </filter>
    <filter id="fileShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#24466F" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="923" height="615" fill="#FFFFFF"/>

  <text x="64" y="168"
        fill="#000000"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="47"
        font-weight="700"
        letter-spacing="-1.8">
    <tspan x="64" dy="0">Where should</tspan>
    <tspan x="64" dy="58">openBIM file</tspan>
    <tspan x="64" dy="58">processing live?</tspan>
  </text>

  <ellipse cx="700" cy="306" rx="188" ry="198" fill="#F2F6FF"/>

  <!-- clean openBIM file stack -->
  <g transform="translate(315 353)" filter="url(#fileShadow)">
    <rect x="-24" y="26" width="96" height="116" rx="12"
          fill="#F7FAFF"
          stroke="#D6E2F8"
          stroke-width="1.5"/>

    <rect x="-12" y="13" width="96" height="116" rx="12"
          fill="#FBFCFF"
          stroke="#B8CEF7"
          stroke-width="1.5"/>

    <rect width="96" height="116" rx="12"
          fill="#FFFFFF"
          stroke="#76A5FF"
          stroke-width="1.8"/>

    <g transform="translate(25 31)"
       fill="none"
       stroke="#0067FF"
       stroke-width="2.2"
       stroke-linejoin="round">
      <path d="M23 0L45 13V38L23 51L1 38V13Z"/>
      <path d="M1 13L23 26L45 13"/>
      <path d="M23 26V51"/>
    </g>

    <rect x="24" y="94" width="48" height="4" rx="2" fill="#DCE8FC"/>
  </g>

  <!-- connection -->
  <path d="M411 411
           C453 411 466 394 470 368
           C474 342 492 328 526 328
           H554"
        fill="none"
        stroke="#0067FF"
        stroke-width="5"
        stroke-linecap="round"/>

  <path d="M544 316L557 328L544 340"
        fill="none"
        stroke="#0067FF"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- browser -->
  <g transform="translate(537 143)" filter="url(#shadow)">
    <rect width="325" height="354" rx="20"
          fill="#FFFFFF"
          stroke="#8FB4F8"
          stroke-width="1.7"/>

    <path d="M20 0H305C316 0 325 9 325 20V47H0V20C0 9 9 0 20 0Z"
