    <circle cx="20" cy="23" r="4" fill="#FFFFFF"/>
    <circle cx="34" cy="23" r="4" fill="#FFFFFF"/>
    <circle cx="48" cy="23" r="4" fill="#FFFFFF"/>

    <rect x="229" y="18" width="66" height="9" rx="4.5" fill="#67A0FF"/>

    <!-- robust building icon -->
    <g transform="translate(38 78)">
      <!-- platform -->
      <path d="M18 221L126 162L237 222L130 282Z"
