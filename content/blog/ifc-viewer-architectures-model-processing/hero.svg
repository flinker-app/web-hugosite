        <path d="M74 108L96 120V144L74 132Z"/>
        <path d="M103 124L119 133V157L103 148Z"/>

        <path d="M74 146L96 158V182L74 170Z"/>
        <path d="M103 162L119 171V195L103 186Z"/>

        <path d="M74 184L96 196V220L74 208Z"/>
        <path d="M103 200L119 209V233L103 224Z"/>
      </g>

      <!-- windows right -->
      <g fill="#9CCAF5" stroke="#5D8FBE" stroke-width=".8">
        <path d="M138 136L160 124V148L138 160Z"/>
        <path d="M167 120L183 111V135L167 144Z"/>

        <path d="M138 174L160 162V186L138 198Z"/>
        <path d="M167 158L183 149V173L167 182Z"/>

        <path d="M138 212L160 200V224L138 236Z"/>
        <path d="M167 196L183 187V211L167 220Z"/>
