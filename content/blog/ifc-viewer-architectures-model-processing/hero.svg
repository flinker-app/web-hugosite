      <path d="M98 58V84L128 101V75"
            fill="#FCFDFE"
            stroke="#A6B6C6"
            stroke-width="1.2"/>
      <path d="M158 58V84L128 101V75"
            fill="#DDE6EF"
            stroke="#A6B6C6"
            stroke-width="1.2"/>

      <!-- entrance -->
      <path d="M113 226L129 235L146 226L130 217Z"
            fill="#FFFFFF"
            stroke="#9AA8B7"
            stroke-width="1"/>

      <!-- landscaping -->
      <g>
        <rect x="49" y="188" width="3" height="24" fill="#705A43"/>
        <circle cx="50.5" cy="180" r="10" fill="#7FAF62"/>
        <circle cx="50.5" cy="171" r="7" fill="#94C478"/>

        <rect x="74" y="198" width="3" height="20" fill="#705A43"/>
        <circle cx="75.5" cy="191" r="9" fill="#76A95A"/>
        <circle cx="75.5" cy="183" r="6" fill="#8EC06E"/>
