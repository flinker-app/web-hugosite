<svg xmlns="http://www.w3.org/2000/svg" width="923" height="615" viewBox="0 0 923 615" role="img" aria-labelledby="title1 desc1">
  <title id="title1">Standards change. Your platform doesn't.</title>
  <desc id="desc1">Configurable ISO 19650 information management rules for naming, status and revision in Microsoft 365 and SharePoint.</desc>

  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8FC"/>
    </linearGradient>

    <linearGradient id="flinkerBlue1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1778F2"/>
      <stop offset="1" stop-color="#78A8ED"/>
    </linearGradient>

    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0E2138" flood-opacity=".09"/>
    </filter>

    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8BA5C4"/>
    </marker>
  </defs>

  <rect width="923" height="615" rx="28" fill="url(#bg1)"/>
  <circle cx="850" cy="70" r="125" fill="#1778F2" opacity=".035"/>
  <circle cx="55" cy="585" r="150" fill="#78A8ED" opacity=".045"/>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Simplified headline -->
    <text x="54" y="92" font-size="35" font-weight="750" fill="#111827">Standards change.</text>
    <text x="54" y="134" font-size="35" font-weight="750" fill="#111827">Your platform doesn't.</text>

    <!-- Rule cards -->
    <g filter="url(#shadow1)">
      <rect x="54" y="220" width="208" height="70" rx="16" fill="#FFFFFF"/>
      <rect x="54" y="307" width="208" height="70" rx="16" fill="#FFFFFF"/>
      <rect x="54" y="394" width="208" height="70" rx="16" fill="#FFFFFF"/>
    </g>

    <g>
      <rect x="71" y="237" width="36" height="36" rx="10" fill="#EDF4FE"/>
      <path d="M80 247h18M80 254h14M80 261h18" stroke="#1778F2" stroke-width="2.2" stroke-linecap="round"/>
      <text x="122" y="250" font-size="11" fill="#8492A6">RULE 01</text>
      <text x="122" y="271" font-size="16" font-weight="700" fill="#172033">Naming</text>

      <rect x="71" y="324" width="36" height="36" rx="10" fill="#EDF4FE"/>
      <circle cx="89" cy="342" r="9" fill="none" stroke="#1778F2" stroke-width="2"/>
      <path d="M85 342l3 3 6-7" fill="none" stroke="#1778F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="122" y="337" font-size="11" fill="#8492A6">RULE 02</text>
      <text x="122" y="358" font-size="16" font-weight="700" fill="#172033">Status</text>

      <rect x="71" y="411" width="36" height="36" rx="10" fill="#F2F6FD"/>
      <path d="M80 430a9 9 0 1 0 3-7" fill="none" stroke="#78A8ED" stroke-width="2"/>
      <path d="M79 420v7h7" fill="none" stroke="#78A8ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="122" y="424" font-size="11" fill="#8492A6">RULE 03</text>
      <text x="122" y="445" font-size="16" font-weight="700" fill="#172033">Revision</text>
    </g>

    <!-- Data flows -->
    <path d="M270 255C320 255 320 333 363 333" fill="none" stroke="#8BA5C4" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow1)"/>
    <path d="M270 342H363" fill="none" stroke="#8BA5C4" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow1)"/>
    <path d="M270 429C320 429 320 351 363 351" fill="none" stroke="#8BA5C4" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow1)"/>

    <!-- SharePoint workspace -->
    <g filter="url(#shadow1)">
      <rect x="364" y="206" width="274" height="314" rx="22" fill="#FFFFFF"/>
    </g>

    <rect x="364" y="206" width="274" height="55" rx="22" fill="#111827"/>
    <path d="M364 239h274v22H364z" fill="#111827"/>

    <g transform="translate(387 220)">
      <rect width="28" height="28" rx="6" fill="#FFFFFF" opacity=".12"/>
      <path d="M7 8h7v12H7zM15 6h7v16h-7z" fill="#FFFFFF"/>
    </g>

    <text x="427" y="240" font-size="16" font-weight="700" fill="#FFFFFF">Microsoft 365 / SharePoint</text>

    <text x="389" y="295" font-size="11" font-weight="700" fill="#8793A5" letter-spacing=".65">INFORMATION CONTAINER</text>

    <rect x="389" y="310" width="224" height="49" rx="10" fill="#F6F8FB"/>
    <text x="402" y="329" font-size="10" fill="#8B96A8">IDENTIFIER</text>
    <text x="402" y="348" font-size="12" font-weight="700" fill="#172033">PRJ–ORG–FUN–SPA–FRM–DIS–001</text>

    <rect x="389" y="375" width="106" height="64" rx="10" fill="#F5F8FC"/>
    <text x="402" y="395" font-size="10" fill="#8B96A8">STATUS</text>
    <rect x="402" y="405" width="40" height="21" rx="10.5" fill="#E7F0FD"/>
    <text x="414" y="420" font-size="11" font-weight="700" fill="#1778F2">S4</text>

    <rect x="507" y="375" width="106" height="64" rx="10" fill="#F5F8FC"/>
    <text x="520" y="395" font-size="10" fill="#8B96A8">REVISION</text>
    <rect x="520" y="405" width="58" height="21" rx="10.5" fill="#EDF4FE"/>
    <text x="530" y="420" font-size="11" font-weight="700" fill="#4C83D1">P01.01</text>

    <rect x="389" y="455" width="224" height="40" rx="10" fill="#F8FAFC"/>
    <circle cx="407" cy="475" r="6" fill="#1778F2"/>
    <line x1="422" y1="475" x2="486" y2="475" stroke="#CAD4E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="499" y1="475" x2="574" y2="475" stroke="#DFE6EF" stroke-width="4" stroke-linecap="round"/>

    <!-- Rules layer -->
    <path d="M646 363H690" fill="none" stroke="#8BA5C4" stroke-width="2" marker-end="url(#arrow1)"/>

    <g filter="url(#shadow1)">
      <rect x="694" y="248" width="177" height="231" rx="19" fill="#FFFFFF"/>
    </g>

    <circle cx="723" cy="280" r="15" fill="url(#flinkerBlue1)"/>
    <path d="M717 280h12M723 274v12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="748" y="285" font-size="14" font-weight="700" fill="#172033">Rules Layer</text>

    <line x1="716" y1="310" x2="848" y2="310" stroke="#E5EAF1"/>

    <text x="716" y="341" font-size="11" fill="#68778B">Code lists</text>
    <rect x="807" y="330" width="41" height="17" rx="8.5" fill="#E7F0FD"/>
    <circle cx="838" cy="338.5" r="6" fill="#1778F2"/>

    <text x="716" y="377" font-size="11" fill="#68778B">Transitions</text>
    <rect x="807" y="366" width="41" height="17" rx="8.5" fill="#E7F0FD"/>
    <circle cx="838" cy="374.5" r="6" fill="#1778F2"/>

    <text x="716" y="413" font-size="11" fill="#68778B">Validation</text>
    <rect x="807" y="402" width="41" height="17" rx="8.5" fill="#E7F0FD"/>
    <circle cx="838" cy="410.5" r="6" fill="#1778F2"/>

    <text x="716" y="449" font-size="11" fill="#68778B">Approvals</text>
    <rect x="807" y="438" width="41" height="17" rx="8.5" fill="#E7F0FD"/>
    <circle cx="838" cy="446.5" r="6" fill="#1778F2"/>

    <text x="54" y="568" font-size="12" font-weight="700" fill="#5C6D82">CONFIGURE THE RULES · KEEP THE PLATFORM</text>
  </g>
</svg>